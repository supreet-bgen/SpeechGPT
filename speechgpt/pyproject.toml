[project]
name = "speechgpt"
version = "0.2.0"
description = ""
authors = [
    {name = "supreet",email = "supreet@tihiitb.org"}
]
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
    "accelerate (==0.20.3)",
    "bitsandbytes (==0.43.1)",
    "datasets (==2.11.0)",
    "deepspeed (==0.9.0)",
    "einops (==0.6.0)",
    "evaluate (==0.4.0)",
    "fairseq @ git+https://github.com/utter-project/fairseq.git",
    "fire (==0.5.0)",
    "gradio (==3.30.0)",
    "gradio-client (==0.2.4)",
    "librosa (==0.10.0.post2)",
    "numpy (==1.22.4)",
    "pathlib (==1.0.1)",
    "peft (==0.3.0)",
    "pyyaml (==6.0)",
    "pydantic (==1.10.7)",
    "sentencepiece (==0.1.98)",
    "soundfile (==0.12.1)",
    "tensorboard (==2.12.2)",
    "tokenizers (==0.13.3)",
    "torch (==2.3.1)",
    "torchaudio (==2.3.1)",
    "torchvision (==0.18.1)",
    "tqdm (==4.65.0)",
    "transformers (==4.33.1)",
    "tensorboardx (>=2.6.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
notebook = "^7.4.5"
ipykernel = "^6.30.1"

